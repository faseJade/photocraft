# Fork-only: builds an unsigned Windows installer of this branch (upstream main + our audit fixes).
# Never part of a PR to storytold/photocraft.
name: Fork Windows installer

on:
  push:
    branches: [build/audit-installer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PHOTOCRAFT_VERSION: 0.20.1-audit
      CRAFT_FONTS_DIR: ${{ github.workspace }}\craft-fonts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
      - name: Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
          rustc --version
      - name: WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build and package
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-audit-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*-portable.zip
          if-no-files-found: error
